[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
doneyet-app = { path = "crates/doneyet-app" }
doneyet-cli = { path = "crates/doneyet-cli" }
doneyet-contract = { path = "crates/doneyet-contract" }
doneyet-core = { path = "crates/doneyet-core" }
doneyet-github = { path = "crates/doneyet-github" }
doneyet-ux = { path = "crates/doneyet-ux" }
anyhow = "1"
anstyle = "1"
anstream = "0.6"
assert_cmd = "2"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
jiff = { version = "0.2", features = ["serde"] }
predicates = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
wiremock = "0.6"

[profile.release]
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
