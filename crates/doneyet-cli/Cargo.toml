[package]
name = "doneyet-cli"
description = "doneyet — exits when it's done yet"
repository = "https://github.com/grimen/doneyet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "doneyet"
path = "src/main.rs"

[package.metadata.dist]
dist = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
crossterm = { workspace = true }
doneyet-app = { workspace = true }
doneyet-core = { workspace = true }
doneyet-github = { workspace = true }
doneyet-ux = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
doneyet-contract = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
wiremock = { workspace = true }
